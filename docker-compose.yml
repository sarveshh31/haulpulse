x-airflow-common: &airflow-common
  image: haulpulse-airflow:2.10.5
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__WEBSERVER__SECRET_KEY: haulpulse-local-dev-secret-key
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Kolkata
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    # Settings used by the pipeline code and dbt inside the containers
    POSTGRES_HOST: warehouse
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    DBT_PROFILES_DIR: /opt/airflow/project/dbt_project
    DBT_TARGET_PATH: /tmp/dbt_target
    DBT_LOG_PATH: /tmp/dbt_logs
  volumes: &airflow-volumes
    - ./orchestration/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
    - ./pipeline:/opt/airflow/project/pipeline
    - ./generator:/opt/airflow/project/generator
    - ./sql:/opt/airflow/project/sql
    - ./dbt_project:/opt/airflow/project/dbt_project
    - ./data:/opt/airflow/project/data

services:
  warehouse:
    image: postgres:15
    container_name: haulpulse_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:15
    container_name: haulpulse_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: haulpulse_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Sarvesh --lastname Tiwari --role Admin --email admin@example.com || true
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: haulpulse_airflow_web
    command: webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: haulpulse_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
  airflow_db_data:
  airflow_logs: